; save_modules.cfg - Enhanced Save System C# module registration.
;
; If SaveSystemCSharp.UseModuleConfig is true, this file controls module order.
; If this file is missing or contains no loadable modules, SaveSystemCSharp
; falls back to scanning addons/enhance_save_system_csharp/Modules.

[settings_module]
path = "res://addons/enhance_save_system_csharp/Modules/SettingsModuleCSharp.cs"
enabled = true
priority = 5

[dialogue_global_module]
path = "res://addons/enhance_save_system_csharp/Modules/DialogueGlobalModuleCSharp.cs"
enabled = true
priority = 10

[dialogue_slot_module]
path = "res://addons/enhance_save_system_csharp/Modules/DialogueSlotModuleCSharp.cs"
enabled = true
priority = 15

[player_module]
path = "res://addons/enhance_save_system_csharp/Modules/PlayerModuleCSharp.cs"
enabled = true
priority = 20

[level_module]
path = "res://addons/enhance_save_system_csharp/Modules/LevelModuleCSharp.cs"
enabled = true
priority = 25
